  <rect x="18" y="14" width="30" height="30" fill="#0C2340" rx="2" />
  <text x="33" y="36" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="20" text-anchor="middle">K</text>

  <!-- Top Right Grey Square -->
  <rect x="52" y="14" width="30" height="30" fill="#D1D5DB" rx="2" />

